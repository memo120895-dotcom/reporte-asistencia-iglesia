name: Exportar Asistencia a Google Sheets

on:
  schedule:
    - cron: '0 2 * * 4'   # Miércoles 9pm hora México (CDT, UTC-5)
    - cron: '0 19 * * 0'  # Domingo 2pm hora México (CDT, UTC-5)
  workflow_dispatch:
    # También se puede correr manualmente desde GitHub haciendo clic en "Run workflow"

jobs:
  exportar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para el commit de mantenimiento del último paso

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Exportar todas las temporadas activas
        run: node exportar-activos.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SHARE_EMAIL: ${{ secrets.SHARE_EMAIL }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      # Si Google emitió un token distinto al de arranque, lo resincroniza al
      # secret para que la próxima corrida ya no dependa de una copia congelada.
      - name: Actualizar GOOGLE_TOKEN_JSON si cambió
        if: always()
        run: |
          if [ -f token.json ]; then
            gh secret set GOOGLE_TOKEN_JSON < token.json
            echo "Token resincronizado."
          else
            echo "No se generó token.json, nada que resincronizar."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # GitHub desactiva los workflows programados tras 60 días sin commits
      # (ya pasó en sep-2026). Si el último commit tiene más de 30 días, deja
      # uno vacío para que el contador se reinicie.
      - name: Mantener activo el workflow
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: mantener activo el workflow programado"
            git push
            echo "Commit de mantenimiento enviado."
          else
            echo "Último commit con menos de 30 días, nada que hacer."
          fi
